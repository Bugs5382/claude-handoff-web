name: Release Drafter
# Keeps the draft release notes current on every push to main. Releasing is
# tagging only: the maintainer publishes the draft by hand, which creates the
# vX.Y.Z tag. Nothing is bumped, committed back or published to a registry.
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  update_release_draft:
    name: 📝 Update Release Draft
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draft release notes
        uses: release-drafter/release-drafter@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
