[project]
name = "claude-handoff-web"
version = "0.0.0"
description = "A small self-updating review and sign-off site for handing work to a human: chips, live updates, Yes/No/Changes reviews, checklists with blockers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The claude-handoff-web Authors" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/Bugs5382/claude-handoff-web"
Issues = "https://github.com/Bugs5382/claude-handoff-web/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
]

# The template is copied into a working folder by install.sh, not installed as a package.
[tool.uv]
package = false

[tool.ruff]
line-length = 140
target-version = "py310"
src = ["template", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["template/_site/serve.py"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# The builders write HTML in long f-strings; keep them as written.
"template/gen-index.py" = ["E501", "E731"]
"template/_site/build-review.py" = ["E501", "E741"]
