[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-handoff-web"
version = "0.0.0"
description = "A small self-updating review and sign-off site for handing work to a human: chips, live updates, Yes/No/Changes reviews, checklists with blockers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The claude-handoff-web Authors" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/Bugs5382/claude-handoff-web"
Issues = "https://github.com/Bugs5382/claude-handoff-web/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/claude_handoff_web"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
