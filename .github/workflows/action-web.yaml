name: Web

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["web/**", "template/_site/app/**", ".github/workflows/action-web.yaml"]

permissions:
  contents: read

jobs:
  web:
    name: 🧱 Built app matches its source
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Compare
        run: git diff --exit-code -- ../template/_site/app
