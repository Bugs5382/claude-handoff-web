<!doctype html>
<html><head><meta charset="utf-8"><title>page smoke harness</title></head><body>
<!-- Smoke tests for JSON pages (render.js plus review.js) in a real browser, run by tests/test_page_smoke.py. Each
     test loads its own page file in a same-origin frame, clicks like the owner would, and the results land in #out
     for Chrome's --dump-dom. -->
<iframe id="f" style="width:1000px;height:800px"></iframe>
<pre id="out">pending</pre>
<script>
const results = {};
const f = document.getElementById("f");
const d = () => f.contentDocument, w = () => f.contentWindow;
const tick = ms => new Promise(r => setTimeout(r, ms));
async function until(cond, what, tries = 600) {
  for (let i = 0; i < tries; i++) { try { if (cond()) return; } catch (e) {} await tick(25); }
  throw new Error("timed out waiting for " + what);
}
function fail(msg) { throw new Error(msg); }
const ok = (v, msg) => { if (!v) fail(msg || "expected truthy"); };
const eq = (a, b, msg) => { if (a !== b) fail((msg ? msg + ": " : "") + JSON.stringify(a) + " !== " + JSON.stringify(b)); };
const match = (s, re, msg) => { if (!re.test(s)) fail((msg ? msg + ": " : "") + JSON.stringify(s) + " !~ " + re); };
async function t(name, fn) {
  try { await fn(); results[name] = "ok"; } catch (e) { results[name] = "FAIL " + String(e && e.stack || e).split("\n").slice(0, 3).join(" | "); }
}
function stub() {
  const win = w();
  win.alert = () => {}; win.confirm = () => true; win.prompt = () => "stuck";
  Object.defineProperty(win.navigator, "clipboard", { configurable: true, value: { writeText: async s => { win.__clip = s; } } });
}
async function open(path) { await new Promise(r => { f.onload = r; f.src = path; }); }
async function load(path) {
  await open(path);
  await until(() => w().siteReview && d().querySelector(".rvbar .cnt").textContent, "the rendered page " + path);
  stub();
  return { win: w(), doc: d(), bar: d().querySelector(".rvbar") };
}
const click = el => el.dispatchEvent(new (w().MouseEvent)("click", { bubbles: true }));
const saved = () => until(() => !w().siteReview.unsaved(), "the save");
const pageFile = async rel => (await (await fetch("/_page/" + rel, { cache: "no-store" })).json()).page;
const answers = async rel => { const p = await pageFile(rel); return p.rounds[p.rounds.length - 1].answers; };
const card = (doc, id) => doc.querySelector('[data-review-question="' + id + '"]');
// Types the way a person does, so React's own input handling sees it too.
const win_css = doc => doc.defaultView.getComputedStyle(doc.querySelector(".custom-progress")).borderLeftWidth;
function typeIn(el, text) {
  const win = el.ownerDocument.defaultView;
  Object.getOwnPropertyDescriptor(win[el.tagName === "INPUT" ? "HTMLInputElement" : "HTMLTextAreaElement"].prototype, "value").set.call(el, text);
  el.dispatchEvent(new win.Event("input", { bubbles: true }));
}
const seg = (doc, id, v) => card(doc, id).querySelector('.seg button[data-v="' + v + '"]');

(async () => {
  await t("review: answers, notes, card follows answer, green then approved, saved to the page file", async () => {
    const { win, doc, bar } = await load("/demo/pf-review-1");
    eq(doc.title, "pf-review-1");
    eq(doc.querySelector("header.top h1").textContent, "pf-review-1");
    const cards = Array.from(doc.querySelectorAll(".rvcard")); eq(cards.length, 4);
    eq(cards[0].querySelector("h2").textContent, "1. A module repo", "numbered from 1");
    click(seg(doc, "r1", "no"));
    eq(cards[0].dataset.answer, "no"); eq(cards[0].querySelector(".rvhead .st").textContent, "No");
    ok(!cards[0].querySelector(".notel").hidden);
    const ta = cards[0].querySelector("textarea"); typeIn(ta, "Split it");
    await saved();
    ["r2", "r3", "r4"].forEach(id => click(seg(doc, id, "yes")));
    ok(bar.classList.contains("all-done")); ok(!bar.classList.contains("approved"));
    click(seg(doc, "r1", "yes"));
    ok(bar.classList.contains("approved")); match(bar.querySelector(".cnt").textContent, /^APPROVED · all 4 Yes/);
    await saved();
    const a = await answers("demo/pf-review-1");
    eq(a.r1.answer, "yes"); eq(a.r1.note, "Split it"); eq(a.r1.was[0].answer, "no"); eq(a.r4.answer, "yes"); eq(a.r4.by, "Alex");
  });

  await t("review: Changes needs a note; Blocker: send now writes a blocker to the inbox; copy blockers", async () => {
    const { win, doc, bar } = await load("/demo/pf-review-2");
    const c = card(doc, "r1");
    click(seg(doc, "r1", "chg"));
    ok(c.querySelector(".rv").classList.contains("empty"));
    const bk = c.querySelector(".blocker-btn"); eq(bk.textContent, "Blocker: send now");
    let alerted = ""; win.alert = m => { alerted = m; };
    click(bk);
    await until(() => alerted, "the blocker alert");
    match(alerted, /^Blocker sent to ops/);
    ok(bar.classList.contains("has-blocker")); eq(bar.querySelector(".bkr").textContent, "1 BLOCKER");
    const p = await pageFile("demo/pf-review-2");
    eq(p.submissions.length, 1); eq(p.submissions[0].kind, "blocker"); eq(JSON.stringify(p.submissions[0].items), '["r1"]');
    eq(p.rounds[0].answers.r1.note, "stuck");
    click(bar.querySelector(".copy-blockers")); await tick(50);
    match(win.__clip, /^BLOCKER: .*\n- \[r1\] A module repo\n {4}Note: stuck\n$/);
  });

  await t("copy route: Blocker: copy now copies, and there is no Send button", async () => {
    const { win, doc, bar } = await load("/demo/pf-copyroute");
    ok(!bar.querySelector(".send-btn"), "no Send on a copy route");
    const bk = card(doc, "r2").querySelector(".blocker-btn"); eq(bk.textContent, "Blocker: copy now");
    click(bk); await tick(100);
    match(win.__clip, /^BLOCKER: Copy route \(\/demo\/pf-copyroute\)\n- \[r2\] The web app\n {4}Note: stuck\n$/);
    eq((await pageFile("demo/pf-copyroute")).submissions.length, 0);
  });

  await t("jump bar: Next and the n key walk open items; the picker filters and Enter jumps", async () => {
    const { win, doc, bar } = await load("/demo/pf-review-3");
    eq(bar.querySelector(".ids-l").textContent, "Open IDs"); eq(bar.querySelector(".ids-n").textContent, "(4)");
    click(seg(doc, "r1", "yes"));
    eq(bar.querySelector(".ids-n").textContent, "(3)");
    click(bar.querySelector(".next")); await tick(500);
    eq(doc.activeElement.closest("[data-review-question]").dataset.reviewQuestion, "r2");
    doc.activeElement.blur();
    win.document.dispatchEvent(new win.KeyboardEvent("keydown", { key: "n", bubbles: true })); await tick(500);
    ok(doc.activeElement.closest("[data-review-question]"), "n moved focus to an item");
    click(bar.querySelector(".ids"));
    const pick = bar.querySelector(".rvids"); ok(!pick.hidden);
    const inp = pick.querySelector("input"); typeIn(inp, "platform");
    eq(pick.querySelectorAll(".rvids-list a").length, 1);
    inp.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
    ok(pick.hidden);
  });

  await t("saved answers load from the page file; a failed save shows amber", async () => {
    const { win, doc, bar } = await load("/demo/pf-saved");
    const c = card(doc, "r1"); eq(c.dataset.answer, "yes");
    eq(seg(doc, "r1", "yes").getAttribute("aria-pressed"), "true");
    match(bar.querySelector(".svst").textContent, /^Saved \d\d:\d\d$/);
    win.fetch = async (u, o = {}) => { if (o.method === "PUT") throw new Error("down"); return { ok: false, status: 500 }; };
    click(seg(doc, "r1", "no"));
    await until(() => bar.classList.contains("save-bad"), "the failed save");
    eq(bar.querySelector(".svst").textContent, "Not saved · retrying");
    eq(win.siteReview.unsaved(), true);
  });

  await t("checklist: skip locks, earlier Yes locked, blocked by a dependency, reopened with its reason, question", async () => {
    const { win, doc, bar } = await load("/demo/pf-check");
    ok(doc.querySelector(".rvdone"), "approved and locked note");
    ok(card(doc, "c1").classList.contains("settled"), "c1 is a locked row");
    eq(seg(doc, "c1", "yes").getAttribute("aria-pressed"), "true"); ok(seg(doc, "c1", "yes").disabled);
    eq(card(doc, "c1").querySelector(".rvhead .st").textContent, "Yes (locked)");
    eq(doc.querySelector(".rvhist").offsetWidth, card(doc, "c2").offsetWidth, "History is as wide as the items");
    eq(card(doc, "c4").querySelector(".rvhead .st").textContent, "Blocked by c2");
    eq(card(doc, "c4").querySelector(".rvhead .st a").getAttribute("href"), "#rv-c2");
    eq(card(doc, "c5").querySelector(".rvhead .st").textContent, "Reopened: fixed in #70");
    match(bar.querySelector(".cnt").textContent, /^0 of 3 answered · 1 blocked · 1 approved and locked · 1 question unanswered/);
    click(seg(doc, "c3", "skip"));
    eq(card(doc, "c3").querySelector(".rvhead .st").textContent, "Skipped (locked)");
    ok(seg(doc, "c3", "yes").disabled);
    ["c2", "c5"].forEach(id => click(seg(doc, id, "yes")));
    ok(bar.classList.contains("approved"), bar.querySelector(".cnt").textContent);
    const r = win.siteReview.results();
    match(r, /- \[c1\] YES: One/); match(r, /- \[c3\] SKIPPED \(locked\): Three/); match(r, /- \[c4\] BLOCKED by c2, NOT ANSWERED: Four/);
    match(r, /Q q1: \(no answer\)/);
    await saved();
    const a = await answers("demo/pf-check");
    eq(a.c3.answer, "skipped"); eq(a.c5.answer, "yes"); ok(!a.c1, "a hidden Yes isn't written into the new round");
  });

  await t("question: Use suggestion fills the answer and saves it", async () => {
    const { doc } = await load("/demo/pf-question");
    const q = card(doc, "q1"); ok(q.querySelector(".rv.question"));
    click(q.querySelector(".suggest-btn"));
    eq(q.querySelector("textarea.qans").value, "5390");
    await saved();
    eq((await answers("demo/pf-question")).q1.answer, "5390");
  });

  await t("backlog: default choice, picking every item turns the bar green, saved", async () => {
    const { win, doc, bar } = await load("/demo/pf-backlog");
    eq(doc.querySelectorAll(".rv.choice").length, 3);
    match(bar.querySelector(".cnt").textContent, /^0 of 3 picked/);
    eq(bar.querySelector(".ids-l").textContent, "Not picked");
    ok(doc.querySelector(".rv .seg button.def").textContent.includes("(default)"));
    const segs = Array.from(doc.querySelectorAll(".rv.choice .seg"));
    segs.forEach((g, i) => click(g.querySelectorAll("button")[i === 0 ? 0 : 1]));
    ok(bar.classList.contains("all-done")); match(bar.querySelector(".cnt").textContent, /^All 3 picked · 1 start · 2 hold/);
    const cta = card(doc, "b3").querySelector("textarea"); typeIn(cta, "After the audit");
    await saved();
    const a = await answers("demo/pf-backlog");
    eq(a.b1.answer, "start"); eq(a.b2.answer, "hold"); eq(a.b3.note, "After the audit");
    match(win.siteReview.results(), /\n1 start · 2 hold\n/);
  });

  await t("theme toggle works on a rendered page", async () => {
    localStorage.removeItem("site-theme");
    const { doc } = await load("/demo/pf-theme");
    await until(() => doc.querySelector("header.top .theme-tg"), "the theme toggle");
    click(doc.querySelector('header.top .theme-tg [data-theme="dark"]'));
    eq(doc.documentElement.getAttribute("data-theme"), "dark");
    click(doc.querySelector('header.top .theme-tg [data-theme="auto"]'));
    ok(!doc.documentElement.hasAttribute("data-theme"));
  });

  await t("bar: one row when it fits, a clean split when it does not, and no control ever wraps", async () => {
    const { win, doc, bar } = await load("/demo/pf-theme");
    const r1 = () => w().document.querySelector(".rvbar-r1"), r2 = () => w().document.querySelector(".rvbar-r2"), b = () => w().document.querySelector(".rvbar");
    const shown = row => Array.from(row.children).filter(el => el.getClientRects().length);
    const spread = row => { const m = shown(row).map(el => { const r = el.getBoundingClientRect(); return r.top + r.height / 2; }); return Math.max(...m) - Math.min(...m); };
    f.style.width = "1000px"; await tick(80);
    ok(!bar.classList.contains("two"), "a short bar stays one row: " + JSON.stringify(["inner", ".cnt", ".dlv-t"].map(q => { const el = q === "inner" ? bar.querySelector(".rvbar-in") : bar.querySelector(q); return el ? [q, el.scrollWidth, el.clientWidth] : q; })));
    ok(bar.getBoundingClientRect().height <= 60, "one row height");
    const controls = () => Array.from(b().querySelectorAll(".rvbar-r1 button, .rvbar-r2 button, .rvbar-r2 a, .dlv-t, .cnt")).filter(el => el.getClientRects().length);
    await load("/demo/pf-bar-long");
    for (const px of [1440, 1024, 800, 600, 390]) {
      f.style.width = px + "px"; await tick(120);
      ok(b().classList.contains("two"), px + ": the longest name and status split the bar");
      ok(r1().getBoundingClientRect().bottom <= r2().getBoundingClientRect().top, px + ": the rows stack");
      eq(shown(r1()).map(el => el.className.split(" ")[0]).join(","), "prev,next,stat,dlv");
      eq(shown(r2())[0].className.split(" ")[0], "send-btn");
      const box = b().querySelector(".rvbar-in").getBoundingClientRect();
      for (const el of controls()) {
        ok(el.getBoundingClientRect().right <= box.right + 1, px + ": inside the bar " + el.className);
        if (el.classList.contains("cnt") || el.classList.contains("dlv-t")) ok(el.scrollWidth <= el.clientWidth + 1, px + ": nothing clipped " + el.className);
        else {
          eq(el.getClientRects().length, 1, px + ": one box " + el.className);
          ok(el.classList.contains("send-btn") && px < 481 || el.scrollWidth <= el.clientWidth + 1, px + ": nothing clipped " + el.className);
          ok(el.getBoundingClientRect().height <= 52, px + ": one line " + el.className);
        }
      }
      eq(w().getComputedStyle(b()).position, "fixed", px + ": always visible");
    }
    Array.from(b().querySelectorAll(".rvbar-r1 button, .rvbar-r2 button")).filter(el => el.getClientRects().length)
      .forEach(el => ok(el.getBoundingClientRect().height >= 44, "phone tap target " + el.className));
    f.style.width = "1000px"; await tick(30);
  });

  await t("samples: every sample page draws, and the states they show are the ones they claim", async () => {
    for (const name of ["review", "signoff", "part-sent", "journey", "backlog"]) {
      const { doc, bar } = await load("/demo/sample-" + name);
      ok(doc.querySelector("[data-review-question]"), name + " has items"); ok(bar.querySelector(".cnt").textContent, name + " counts");
    }
    let { doc } = await load("/demo/sample-signoff");
    eq(card(doc, "c2").querySelector(".rvhead .st").textContent, "Blocked by c1");
    eq(card(doc, "c4").querySelector(".rvhead .st").textContent, "Blocked by the vendor's new key");
    ({ doc } = await load("/demo/sample-came-back"));
    eq(card(doc, "a").querySelector(".rvhead .st").textContent, "Yes (locked)");
    eq(card(doc, "b").querySelector(".rvhead .st").textContent, "Updated: answer again");
    match(card(doc, "c").querySelector(".rvhead .st").textContent, /^Reopened: The address changed/);
    ({ doc } = await load("/demo/sample-part-sent"));
    ok(seg(doc, "a", "yes").disabled, "the sent item is locked"); ok(!seg(doc, "b", "yes").disabled, "the rest stay open");
    for (const id of ["a", "q1"]) {
      ok(card(doc, id).classList.contains("is-sent"), id + ": green box while it waits");
      eq(card(doc, id).querySelector(".rvhead .st").textContent, "Sent, waiting");
    }
    ok(card(doc, "q1").querySelector("textarea").disabled, "a sent question is locked");
    ok(!card(doc, "b").classList.contains("is-sent"), "an item not sent has no box");
    eq((await fetch("/_page/demo/sample-reference")).status, 200);
  });

  await t("round phases: lettered ids, phase and step blocking, its own Send, and Accept risk needs a note", async () => {
    const { win, doc, bar } = await load("/demo/sample-round-phases");
    eq(doc.querySelectorAll(".phase").length, 4); eq(card(doc, "A1").querySelector(".rvhead .rid").textContent, "A1");
    eq(card(doc, "B1").querySelector(".rvhead .st").textContent, "Blocked by A");
    eq(card(doc, "B3").querySelector(".rvhead .st").textContent, "Blocked by A2");
    eq(card(doc, "D1").querySelector(".rvhead .st").textContent, "Blocked by C");
    eq(card(doc, "B3").querySelector(".rvhead .st a").getAttribute("href"), "#rv-A2");
    eq(card(doc, "B1").querySelector(".rvhead .st a").getAttribute("href"), "#rv-A", "a phase link");
    ok(!bar.querySelector(".send-btn"), "each phase sends itself");
    const a = doc.getElementById("phase-A"); ok(a.querySelector(".phase-send"));
    ok(doc.getElementById("phase-B").querySelector(".phase-send").disabled, "a blocked phase can't send");
    click(seg(doc, "A2", "risk")); ok(card(doc, "A2").querySelector(".rv").classList.contains("empty"), "the note is required");
    typeIn(card(doc, "A2").querySelector("textarea"), "We say so in the plan");
    click(seg(doc, "A3", "yes")); await saved();
    const ph = await pageFile("demo/sample-round-phases");
    eq(ph.rounds[0].answers.A2.answer, "risk");
  });

  await t("email: reads as To, Subject and Body, says what to enter, carries the step, and locks nothing", async () => {
    const { win, doc } = await load("/demo/sample-round-phases");
    const box = card(doc, "A2").querySelector(".email");
    const vers = box.querySelectorAll(".email-vers button"); eq(vers.length, 2);
    eq(Array.from(box.querySelectorAll(".email-label")).map(x => x.textContent).join(","), "To,Subject,Body");
    eq(box.querySelectorAll(".email-part .copy-cmd").length, 3, "a copy button on each");
    match(box.textContent, /Switch inventory changed: check by Friday/);
    click(vers[0]);
    match(box.textContent, /sw-harbor-2 is at 192\.0\.2\.14, not 192\.0\.2\.12/);
    ok(!card(doc, "A4").querySelector(".email"), "no email control until it's asked for");
    const more = card(doc, "A4").querySelector(".item-more-btn"), menu = card(doc, "A4").querySelector(".item-more-menu");
    ok(menu.hidden, "the menu starts closed"); click(more); ok(!menu.hidden, "More pops it up");
    eq(menu.querySelector('[data-action="draft-email"]').textContent, "Generate an email");
    click(menu.querySelector('[data-action="draft-email"]')); ok(menu.hidden, "picking closes it");
    const form = card(doc, "A4").querySelector(".email-form");
    match(form.querySelector(".email-help").textContent, /already has this step, what changed and the comments/);
    ok(card(doc, "A4").querySelector(".email-top .email-cancel"), "Cancel sits at the top, beside the versions");
    ok(form.querySelector(".email-send").disabled, "it needs who and what");
    typeIn(form.querySelector("input"), "Whoever runs the Quay switches");
    typeIn(form.querySelector("textarea"), "Grant access to the three devices");
    click(form.querySelector(".email-send"));
    await until(() => w().document.querySelector('[data-email="A4"] .email-wait'), "the ask to land");
    ok(!seg(w().document, "A4", "yes").disabled, "nothing locked");
    eq(card(w().document, "A4").querySelector(".rvhead .st").textContent, "Open", "it doesn't answer the item");
    const ph = await pageFile("demo/sample-round-phases");
    const sub = ph.submissions[ph.submissions.length - 1]; eq(sub.kind, "email"); eq(sub.items[0], "A4"); eq(sub.recipient, "Whoever runs the Quay switches");
    const box2 = card(w().document, "A2").querySelector(".email");
    const change = box2.querySelector(".email-actions .email-change"), copy = box2.querySelector(".copy-cmd");
    eq(change.textContent, "Ask for changes");
    const look = el => { const c = w().getComputedStyle(el); return [c.height, c.fontSize, c.fontWeight, c.fontFamily, c.borderRadius, c.borderTopWidth].join("|"); };
    eq(look(change), look(copy), "the same button as Copy");
    ok(parseFloat(w().getComputedStyle(change).borderRadius) > 0, "not a default control");
    ok(parseFloat(w().getComputedStyle(card(w().document, "A1").querySelector(".settled-tg")).borderRadius) > 0, "nor is Show on a locked row");
    for (const b of box2.querySelectorAll(".email-vers button")) ok(parseFloat(w().getComputedStyle(b).minHeight) === 32, "the version buttons are styled");
    click(box2.querySelector(".email-change"));
    typeIn(box2.querySelector(".email-form textarea"), "Name the freeze date");
    click(box2.querySelector(".email-form .email-send"));
    await tick(200);
    const last = (await pageFile("demo/sample-round-phases")).submissions.pop();
    eq(last.change, "Name the freeze date"); eq(last.basedOn, 1, "from the version picked");
  });

  await t("deck: asks what you're building, sends only final Yes and Accept risk, and locks nothing", async () => {
    const { win, doc, bar } = await load("/demo/sample-round-phases");
    click(seg(doc, "A3", "no")); await saved();
    let asked = ""; win.prompt = q => { asked = q; return "A presentation on the timeline and risks"; };
    ok(!bar.querySelector(".rvbar-r1 .deck-btn, .rvbar-r2 .deck-btn"), "it isn't on the bar");
    click(bar.querySelector(".more-btn")); ok(!bar.querySelector(".menu").hidden);
    click(bar.querySelector(".menu .deck-btn"));
    await until(() => asked, "the question"); match(asked, /^What are you trying to build\?/);
    const ph = await (async () => { for (let i = 0; i < 80; i++) { const x = await pageFile("demo/sample-round-phases"); if (x.submissions.some(s => s.kind === "deck")) return x; await tick(25); } })();
    const sub = ph.submissions.find(s => s.kind === "deck");
    eq(sub.framing, "A presentation on the timeline and risks");
    ok(sub.items.includes("A1"), "a Yes goes"); ok(!sub.items.includes("A3"), "a No stays out"); ok(!sub.items.includes("B1"), "an open item stays out");
    ok(!seg(w().document, "A2", "yes").disabled, "nothing locked");
  });

  await t("custom: a template from custom/ draws the page, on the same elements", async () => {
    const { doc } = await load("/demo/sample-custom");
    match(doc.querySelector(".custom-progress").textContent, /^0 of 2 done/, "the template ran"); ok(card(doc, "s1").querySelector(".seg"), "on the same elements");
    eq(win_css(doc), "4px", "custom.css loaded after the base");
    const menu = card(doc, "s2").querySelector(".item-more-menu");
    ok(menu.querySelector('[data-action="copy-title"]'), "a custom action joins the same menu");
    click(card(doc, "s2").querySelector(".item-more-btn"));
    click(menu.querySelector('[data-action="copy-title"]')); await tick(30);
    eq(doc.defaultView.__clip, "Book the change window");
    const link = doc.querySelector('.rvbar .menu a[data-action="guide"]');
    eq(link.getAttribute("href"), "/guide/", "a custom link takes a slot in the bar's More menu");
    ok(!doc.querySelector('.rvbar-r2 [data-action]'), "nothing custom on the bar itself");
  });

  await t("round single: Accept risk on one set of items, sent from the bar", async () => {
    const { doc, bar } = await load("/demo/sample-round-single");
    ok(bar.querySelector(".send-btn")); ok(!doc.querySelector(".phase"));
    ok(seg(doc, "s3", "risk"));
    ["s1", "s2"].forEach(id => click(seg(doc, id, "yes")));
    click(seg(doc, "s3", "risk")); typeIn(card(doc, "s3").querySelector("textarea"), "No staging, said up front");
    ok(bar.classList.contains("approved"), bar.querySelector(".cnt").textContent);
  });

  await t("bar: the longest count stays on one line beside a picked-up status, with the full text on hover", async () => {
    const { bar } = await load("/demo/pf-bar-count");
    const cnt = bar.querySelector(".cnt");
    match(cnt.textContent, /^0 of 5 answered · 2 blocked · 3 approved and locked/);
    eq(bar.querySelector(".dlv-t").textContent, "picked up 07:43");
    match(bar.querySelector(".dlv-t").title, /^Picked up by a{41} 07:43/);

    const ch = card(doc, "r2");
    eq(ch.querySelector("a.rid").getAttribute("href"), "#rv-r2");
    eq(seg(doc, "r2", "chg").getAttribute("aria-pressed"), "false"); eq(ch.querySelector(".rv textarea").value, "");
    eq(ch.querySelector(".rvhead .st").textContent, "Updated: answer again");
    match(ch.querySelector(".thread").textContent, /Changes/);
    click(bar.querySelector(".more-btn")); click(bar.querySelector(".copy")); await tick(50);
    match(win.__clip, /r1/);
  });

  await t("reopened Yes: shows unanswered, and one Yes clears it", async () => {
    const { doc } = await load("/demo/pf-reopened");
    eq(seg(doc, "r1", "yes").getAttribute("aria-pressed"), "false", "not already pressed");
    match(card(doc, "r1").textContent, /Reopened: numbers moved/);
    click(seg(doc, "r1", "yes"));
    await saved();
    const p = await pageFile("demo/pf-reopened");
    eq(JSON.stringify(p.rounds[0].reopened), "{}"); eq(p.rounds[0].answers.r1.answer, "yes");
  });

  await t("restart: Restart from a checkpoint asks first, opens a new round and carries the steps", async () => {
    const { win, doc } = await load("/demo/pf-journey");
    const box = doc.querySelector(".rvrestart"); ok(box, "the restart bar");
    eq(box.querySelector("h2").textContent, "Restart from a checkpoint");
    const b = box.querySelector('button[data-cp="after-install"]'); ok(b, "Restart from after-install");
    eq(b.querySelector(".cp-name").textContent, "After install"); eq(b.querySelector(".cp-step").textContent, "after step 1");
    let asked = 0; win.confirm = () => { asked++; return true; };
    const conf = box.querySelector(".restart-confirm"); ok(conf.hidden, "no confirm yet");
    click(b);
    ok(!conf.hidden, "the confirm opens"); eq(asked, 0, "no browser dialog");
    match(conf.querySelector(".restart-q").textContent, /^Restart from After install\? Step 2 starts open again, and ops resets the environment first\.$/);
    click(conf.querySelector(".restart-cancel"));
    ok(conf.hidden, "Cancel closes it");
    eq((await pageFile("demo/pf-journey")).rounds.length, 1, "nothing restarted");
    click(b); click(conf.querySelector(".restart-go"));
    await until(() => card(w().document, "j2") && card(w().document, "j2").dataset.answer === "", "the redraw after restart");
    const p = await pageFile("demo/pf-journey");
    eq(p.rounds.length, 2); eq(p.rounds[1].restart, "after-install"); eq(p.rounds[1].answers.j1.answer, "yes");
    eq(card(w().document, "j1").dataset.answer, "yes");
  });

  await t("restart: the restart shows its own delivery state", async () => {
    const { doc } = await load("/demo/pf-journey2");
    const box = doc.querySelector(".rvrestart");
    ok(!box.querySelector(".restart-dlv"), "no state before a restart");
    click(box.querySelector('button[data-cp="after-install"]')); click(box.querySelector(".restart-go"));
    await until(() => w().document.querySelector(".rvrestart .restart-dlv"), "the restart's delivery state");
    const dlv = w().document.querySelector(".rvrestart .restart-dlv");
    eq(dlv.dataset.state, "deaf");
    match(dlv.querySelector(".dlv-t").textContent, /^Restarted from After install \d\d:\d\d · ops isn't listening\.$/);
  });

  await t("live: a change on the server redraws without a reload, after typing stops, keeping the note and scroll", async () => {
    const { win, doc } = await load("/demo/pf-live");
    win.__alive = true;
    click(seg(doc, "r2", "no"));
    const ta = card(doc, "r2").querySelector("textarea"); ta.focus(); typeIn(ta, "Half typed");
    await saved();
    win.scrollTo(0, 200); const y = win.scrollY;
    await fetch("/_page/demo/pf-live/answers", { method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ answers: { r3: { answer: "yes", note: "" } } }) });
    await tick(15000);
    eq(card(doc, "r3").dataset.answer || "", "", "no redraw while typing");
    eq(ta.value, "Half typed");
    ta.blur();
    await until(() => card(w().document, "r3").dataset.answer === "yes", "the redraw", 1200);
    eq(w().__alive, true, "no reload");
    eq(card(w().document, "r2").querySelector("textarea").value, "Half typed");
    ok(Math.abs(w().scrollY - y) < 5, "scroll kept: " + w().scrollY + " vs " + y);
  });

  await t("reference page: blocks render and there is no answer bar", async () => {
    await open("/demo/pf-reference");
    await until(() => d().querySelector("[data-item='n1']"), "the rendered item");
    ok(!d().querySelector(".rvbar"), "no bar");
    eq(d().querySelector("[data-item='n1'] p strong").textContent, "team");
    ok(d().querySelector("[data-item='n1'] .copyblk button"), "a Copy button");
    eq(d().querySelectorAll("[data-item='n1'] table tr").length, 2);
  });
  await t("mixed page: a section, a two-answer section, a question, a choice, a step and an info item each answer their own way", async () => {
    const { win, doc, bar } = await load("/demo/pf-mixed");
    const vals = id => Array.from(card(doc, id).querySelectorAll(".seg button")).map(b => b.dataset.v).join(",");
    eq(vals("s1"), "yes,no,chg", "a section answers Yes / No / Changes");
    eq(vals("s2"), "yes,no", "its own answers set");
    eq(vals("j1"), "yes,no,chg,skip", "a step adds Skipped");
    eq(vals("c1"), "start,hold", "a choice uses the page's options");
    ok(card(doc, "c1").querySelector(".seg button.def"), "the default choice is marked");
    ok(card(doc, "q1").querySelector("textarea.qans"), "a question takes free text");
    ok(!doc.querySelector('[data-item="i1"] .seg'), "an info item has no answers");
    click(seg(doc, "s1", "yes")); click(seg(doc, "s2", "no")); click(seg(doc, "c1", "start"));
    click(card(doc, "q1").querySelector(".suggest-btn"));
    click(seg(doc, "j1", "skip"));
    ok(bar.classList.contains("all-done"), bar.querySelector(".cnt").textContent);
    await saved();
    const a = await answers("demo/pf-mixed");
    eq(a.s1.answer, "yes"); eq(a.s2.answer, "no"); eq(a.c1.answer, "start"); eq(a.q1.answer, "UTC"); eq(a.j1.answer, "skipped");
    const asked = []; win.confirm = m => { asked.push(m); return true; }; let alerted = ""; win.alert = m => { alerted = m; };
    click(bar.querySelector(".all-no"));
    eq(alerted, "Every item already has an answer.");
  });
  await t("example pages: every page in example/demo renders, and the answerable ones answer", async () => {
    const want = { "design-review": 4, "signoff-checklist": 3, "backlog": 3, "first-order": 4 };
    for (const [slug, n] of Object.entries(want)) {
      const { doc, bar } = await load("/demo/" + slug);
      eq(doc.querySelectorAll("main section[data-review-question]").length, n, slug + " items");
      const b = doc.querySelector(".rv .seg button");
      click(b);
      ok(/answered|picked/.test(bar.querySelector(".cnt").textContent), slug + ": " + bar.querySelector(".cnt").textContent);
    }
    await open("/demo/release-notes");
    await until(() => d().querySelector("[data-item='n2'] .copyblk"), "the reference page");
    ok(!d().querySelector(".rvbar"), "no bar on a reference page");
  });
})().catch(e => { results.harness = "FAIL " + String(e && e.stack || e); })
  .finally(() => { document.getElementById("out").textContent = JSON.stringify(results); });
</script></body></html>
