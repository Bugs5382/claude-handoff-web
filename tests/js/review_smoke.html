<!doctype html>
<html><head><meta charset="utf-8"><title>smoke harness</title></head><body>
<!-- Smoke tests for review.js and theme.js in a real browser, run by tests/test_review_smoke.py. Each
     test loads its own copy of a page (so saved answers never leak between tests) in a same-origin
     frame, clicks like the owner would, and the results land in #out for Chrome's --dump-dom. -->
<iframe id="f" style="width:1000px;height:800px"></iframe>
<pre id="out">pending</pre>
<script>
const results = {};
const f = document.getElementById("f");
const d = () => f.contentDocument, w = () => f.contentWindow;
const tick = ms => new Promise(r => setTimeout(r, ms));
async function until(cond, what) {
  for (let i = 0; i < 400; i++) { try { if (cond()) return; } catch (e) {} await tick(25); }
  throw new Error("timed out waiting for " + what);
}
function fail(msg) { throw new Error(msg); }
const ok = (v, msg) => { if (!v) fail(msg || "expected truthy"); };
const eq = (a, b, msg) => { if (a !== b) fail((msg ? msg + ": " : "") + JSON.stringify(a) + " !== " + JSON.stringify(b)); };
const match = (s, re, msg) => { if (!re.test(s)) fail((msg ? msg + ": " : "") + JSON.stringify(s) + " !~ " + re); };
async function t(name, fn) {
  try { await fn(); results[name] = "ok"; } catch (e) { results[name] = "FAIL " + String(e && e.stack || e).split("\n").slice(0, 3).join(" | "); }
}
function stub() {
  const win = w();
  win.alert = () => {}; win.confirm = () => true; win.prompt = () => "stuck";
  Object.defineProperty(win.navigator, "clipboard", { configurable: true, value: { writeText: async s => { win.__clip = s; } } });
}
async function load(path) {
  await new Promise(r => { f.onload = r; f.src = path; });
  await until(() => w().siteReview && d().querySelector(".rvbar .cnt").textContent, "review.js on " + path);
  stub();
  return { win: w(), doc: d(), bar: d().querySelector(".rvbar") };
}
const click = el => el.dispatchEvent(new (w().MouseEvent)("click", { bubbles: true }));
const saved = () => until(() => !w().siteReview.unsaved(), "the save");

(async () => {
  await t("backlog: choices start not picked, bar dark, picker says Not picked", async () => {
    const { doc, bar } = await load("/demo/sm-backlog-1.html");
    const n = doc.querySelectorAll(".rv.choice").length; ok(n > 0);
    ok(!bar.classList.contains("all-done"));
    match(bar.querySelector(".cnt").textContent, new RegExp("^0 of " + n + " picked"));
    eq(bar.querySelector(".ids-l").textContent, "Not picked");
    eq(bar.querySelector(".ids-n").textContent, "(" + n + ")");
    ok(doc.querySelector(".rv .seg button.def").textContent.includes("(default)"));
  });
  await t("backlog: picking every item (Hold included) turns the bar green", async () => {
    const { win, doc, bar } = await load("/demo/sm-backlog-2.html");
    const segs = Array.from(doc.querySelectorAll(".rv.choice .seg"));
    segs.forEach((g, i) => click(g.querySelectorAll("button")[i === 0 ? 0 : 1]));
    ok(bar.classList.contains("all-done"), bar.querySelector(".cnt").textContent);
    ok(!bar.classList.contains("approved"));
    match(bar.querySelector(".cnt").textContent, /^All \d+ picked · 1 start · \d+ hold/);
    await saved();
    const box = await (await fetch(win.siteReview.saveUrl, { cache: "no-store" })).json();
    eq(box.s1.v, "start");
    const r = win.siteReview.results(); match(r, /- \[s1\] START: /); match(r, /\n1 start · \d+ hold\n/);
  });
  await t("backlog: clicking the picked choice again returns it to the default", async () => {
    const { doc, bar } = await load("/demo/sm-backlog-3.html");
    const b = doc.querySelector(".rv.choice .seg button");
    click(b); eq(b.getAttribute("aria-pressed"), "true");
    click(b); eq(b.getAttribute("aria-pressed"), "false");
    match(bar.querySelector(".cnt").textContent, /^0 of/);
  });
  await t("review page: segmented answers, card follows answer, green then approved", async () => {
    const { win, doc, bar } = await load("/demo/sm-review-1.html");
    const cards = Array.from(doc.querySelectorAll(".rvcard")); ok(cards.length >= 4, "cards " + cards.length);
    ok(cards[0].querySelector(":scope > .rvhead .rid"));
    eq(bar.querySelector(".ids-l").textContent, "Open IDs");
    const yes = c => c.querySelector('.seg button[data-v="yes"]'), no = c => c.querySelector('.seg button[data-v="no"]');
    click(no(cards[0]));
    eq(cards[0].dataset.answer, "no");
    eq(cards[0].querySelector(".rvhead .st").textContent, "No");
    ok(!cards[0].querySelector(".notel").hidden);
    cards.slice(1).forEach(c => click(yes(c)));
    ok(bar.classList.contains("all-done")); ok(!bar.classList.contains("approved"));
    match(bar.querySelector(".cnt").textContent, /^All \d+ answered · ready to copy/);
    click(yes(cards[0]));
    ok(bar.classList.contains("approved"));
    match(bar.querySelector(".cnt").textContent, /^APPROVED · all \d+ Yes/);
    match(win.siteReview.results(), /APPROVED: every item is Yes\./);
  });
  await t("review page: Changes needs a note; blocker rings the bar; copy blockers", async () => {
    const { win, doc, bar } = await load("/demo/sm-review-2.html");
    const c = doc.querySelector(".rvcard");
    click(c.querySelector('.seg button[data-v="chg"]'));
    ok(c.querySelector(".rv").classList.contains("empty"));
    ok(bar.querySelector(".ids-n").textContent.length);
    click(c.querySelector(".blocker-btn")); await tick(50);
    ok(bar.classList.contains("has-blocker"));
    eq(bar.querySelector(".bkr").textContent, "1 BLOCKER");
    ok(c.classList.contains("is-blocker"));
    click(bar.querySelector(".copy-blockers")); await tick(50);
    match(win.__clip, /^BLOCKER: .*\n- \[r1\] .*\n {4}Note: stuck\n$/);
  });
  await t("review page: picker filters by words and Enter jumps", async () => {
    const { win, bar } = await load("/demo/sm-review-3.html");
    click(bar.querySelector(".ids"));
    const pick = bar.querySelector(".rvids"); ok(!pick.hidden);
    const inp = pick.querySelector("input"); inp.value = "web app"; inp.dispatchEvent(new win.Event("input"));
    eq(pick.querySelectorAll(".rvids-list a").length, 1);
    match(pick.querySelector(".rvids-h").textContent, /\d+ open · showing 1$/);
    inp.value = "zzzz"; inp.dispatchEvent(new win.Event("input"));
    ok(pick.querySelector(".nomatch"));
    inp.value = ""; inp.dispatchEvent(new win.Event("input"));
    inp.dispatchEvent(new win.KeyboardEvent("keydown", { key: "ArrowDown", bubbles: true }));
    ok(pick.querySelectorAll(".rvids-list a")[1].classList.contains("on"));
    inp.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
    ok(pick.hidden);
  });
  await t("saved answers load and render; save failure shows amber", async () => {
    const { win, doc, bar } = await load("/demo/sm-saved.html");
    const c = doc.querySelector(".rvcard"); eq(c.dataset.answer, "yes");
    eq(c.querySelector('.seg button[data-v="yes"]').getAttribute("aria-pressed"), "true");
    win.fetch = async (u, o = {}) => { if (o.method === "PUT") throw new Error("down"); return { ok: false, status: 500 }; };
    click(c.querySelector('.seg button[data-v="no"]'));
    await until(() => bar.classList.contains("save-bad"), "the failed save");
    eq(bar.querySelector(".svst").textContent, "Not saved · retrying");
    eq(win.siteReview.unsaved(), true);
  });
  await t("unified page: group chips and total still count", async () => {
    const { doc } = await load("/demo/sm-unified/");
    const chip = doc.querySelector("summary [data-open-chip]"); ok(chip); const n0 = parseInt(chip.textContent, 10);
    click(doc.querySelector('.item .seg button[data-v="yes"]'));
    eq(parseInt(chip.textContent, 10), n0 - 1);
    eq(doc.querySelector(".open-total").textContent, "2");
    ok(doc.querySelector(".grp-copy"));
  });
  await t("synthetic: h2 items, skip locks, approved hidden, blocked, question", async () => {
    const { win, doc, bar } = await load("/demo/sm-synth.html");
    eq(doc.querySelectorAll(".rv").length, 5);
    ok(doc.querySelector(".rvdone"));
    eq(doc.querySelector("#rv-s4 .st").textContent, "Blocked by s2");
    ok(doc.querySelector("header.top .crumb"));
    match(bar.querySelector(".cnt").textContent, /^0 of 2 answered · 1 blocked · 1 approved and hidden · 1 question unanswered/);
    click(doc.querySelector('#rv-s3 .seg button[data-v="skip"]'));
    eq(doc.querySelector("#rv-s3 .st").textContent, "Skipped (locked)");
    ok(doc.querySelector('#rv-s3 .seg button[data-v="yes"]').disabled);
    click(doc.querySelector('#rv-s2 .seg button[data-v="yes"]'));
    ok(bar.classList.contains("approved"), bar.querySelector(".cnt").textContent);
    const r = win.siteReview.results();
    match(r, /- \[s1\] YES: One/); match(r, /- \[s3\] SKIPPED \(locked\): Three/);
    match(r, /- \[s4\] BLOCKED by s2, NOT ANSWERED: Four/); match(r, /Q s5: \(no answer\)/);
  });
  await t("theme toggle sets data-theme, saves it, Auto clears it; survives blocked storage", async () => {
    const inject = async () => {
      const s = d().createElement("script"); s.src = "/_site/theme.js"; d().head.appendChild(s);
      await until(() => w().siteTheme, "theme.js"); await tick(50);
    };
    const plain = async path => { await new Promise(r => { f.onload = r; f.src = path; }); };
    localStorage.removeItem("site-theme");
    await plain("/demo/sm-theme-1.html"); await inject();
    const tg = d().querySelector("header.top .theme-tg"); ok(tg, "toggle mounted in the header");
    const btn = v => tg.querySelector('[data-theme="' + v + '"]');
    eq(btn("auto").getAttribute("aria-pressed"), "true");
    ok(!d().documentElement.hasAttribute("data-theme"));
    click(btn("dark"));
    eq(d().documentElement.getAttribute("data-theme"), "dark");
    eq(w().localStorage.getItem("site-theme"), "dark");
    eq(btn("dark").getAttribute("aria-pressed"), "true");
    click(btn("light")); eq(d().documentElement.getAttribute("data-theme"), "light");
    click(btn("auto")); ok(!d().documentElement.hasAttribute("data-theme")); eq(w().localStorage.getItem("site-theme"), null);
    // A saved choice applies on load; a page without a header gets the floating toggle.
    localStorage.setItem("site-theme", "dark");
    await plain("/demo/sm-theme-2.html"); await inject();
    eq(d().documentElement.getAttribute("data-theme"), "dark");
    ok(d().querySelector(".theme-tg.floating"));
    localStorage.removeItem("site-theme");
    // Storage that throws: still switches for this page.
    await plain("/demo/sm-theme-3.html");
    Object.defineProperty(w(), "localStorage", { configurable: true, get() { throw new Error("blocked"); } });
    await inject();
    click(d().querySelector('[data-theme="dark"]'));
    eq(d().documentElement.getAttribute("data-theme"), "dark");
  });
  await t("finished page: green bar and toast point back to the folder; Copy results returns after 1.5 s", async () => {
    const { doc, bar } = await load("/demo/sm-fin-1.html");
    const back = bar.querySelector(".back"); ok(back.hidden);
    doc.querySelectorAll('.seg button[data-v="yes"]').forEach(b => click(b));
    ok(bar.classList.contains("approved")); ok(!back.hidden);
    eq(back.getAttribute("href"), "/demo/"); eq(back.textContent, "← Back to Demo pages");
    const toast = doc.querySelector(".site-toast.act"); ok(toast, "toast"); eq(toast.querySelector("a").getAttribute("href"), "/demo/");
    click(bar.querySelector(".copy")); await tick(400);
    eq(w().location.pathname, "/demo/sm-fin-1.html", "not before 1.5 s");
    await until(() => w().location.pathname === "/demo/", "going back to the folder");
  });
  await t("finished page: typing or moving after Copy results stays", async () => {
    const { win, doc, bar } = await load("/demo/sm-fin-2.html");
    doc.querySelectorAll('.seg button[data-v="no"]').forEach(b => click(b));
    ok(bar.classList.contains("all-done")); ok(!bar.classList.contains("approved"));
    click(bar.querySelector(".copy")); await tick(100);
    win.dispatchEvent(new win.KeyboardEvent("keydown", { key: "a", bubbles: true }));
    await tick(1700);
    eq(w().location.pathname, "/demo/sm-fin-2.html");
    match(doc.querySelector(".site-toast.act").textContent, /Staying on this page/);
  });
  await t("unfinished page: Copy results stays put and no back link", async () => {
    const { doc, bar } = await load("/demo/sm-fin-3.html");
    click(doc.querySelector('.seg button[data-v="yes"]'));
    ok(bar.querySelector(".back").hidden);
    click(bar.querySelector(".copy")); await tick(1800);
    eq(w().location.pathname, "/demo/sm-fin-3.html");
  });
  await t("blocker and reopened pills: later paints keep both pills and Add a note still opens", async () => {
    const { win, doc } = await load("/demo/sm-pills.html");
    const errs = []; win.addEventListener("error", e => errs.push(e.message));
    const card = id => doc.querySelector("#rv-" + id).closest(".rvcard");
    const pills = id => Array.from(card(id).querySelector(":scope > .rvhead").children).filter(x => x.matches("[class^=st]")).map(x => x.textContent);
    click(card("r1").querySelector('.seg button[data-v="yes"]'));
    click(card("r1").querySelector(".blocker-btn")); await tick(50);
    click(card("r2").querySelector('.seg button[data-v="yes"]'));
    click(card("r3").querySelector(".add-note"));
    eq(errs.join(" | "), "", "errors while painting");
    ok(!card("r3").querySelector(".notel").hidden, "note box opens");
    eq(JSON.stringify(pills("r1")), JSON.stringify(["Blocker", "Yes"]));
    eq(JSON.stringify(pills("r2")), JSON.stringify(["Reopened: fixed in 1.2", "Yes"]));
  });
  await t("diff block: added underlined, removed struck through, unchanged dimmed, item still answers", async () => {
    const { win, doc } = await load("/demo/sm-diff.html");
    await until(() => win.getComputedStyle(doc.querySelector(".rvdiff ins")).textDecorationLine.includes("underline"), "site.css on the diff");
    const cs = el => win.getComputedStyle(doc.querySelector(el));
    match(cs(".rvdiff ins").textDecorationLine, /underline/, "ins decoration");
    match(cs(".rvdiff del").textDecorationLine, /line-through/, "del decoration");
    ok(cs(".rvdiff ins").backgroundColor !== cs(".rvdiff del").backgroundColor, "ins and del backgrounds differ");
    ok(cs(".rvdiff ins").backgroundColor !== "rgba(0, 0, 0, 0)", "ins has a background");
    ok(cs(".rvdiff .same").color !== cs(".rvdiff ins").color, "unchanged text is dimmed, not coloured");
    const code = doc.querySelector(".rvdiff.code p"), lh = parseFloat(win.getComputedStyle(code).lineHeight);
    ok(code.getBoundingClientRect().height >= 2.5 * lh, "a multi-line diff keeps its line breaks (" + code.getBoundingClientRect().height + "px, line " + lh + "px)");
    match(win.getComputedStyle(code).fontFamily, /mono|Menlo/i, "a code diff is monospace");
    const card = doc.querySelector("#rv-d1").closest(".rvcard");
    ok(card.contains(doc.querySelector(".rvdiff")), "the diff sits inside the item card");
    click(card.querySelector('.seg button[data-v="yes"]'));
    match(doc.querySelector(".rvbar .cnt").textContent, /1 of 1|APPROVED|All 1/i, "the item answers");
  });
  const mode = bar => Array.from(bar.querySelectorAll("button")).filter(b => b.getAttribute("aria-pressed") === "true").map(b => b.dataset.v).join();
  await t("diff switch: Final hides removed text and un-styles added text, Diff restores both", async () => {
    const { win, doc } = await load("/demo/sm-diff-2.html");
    const block = doc.querySelector(".rvdiff"), bar = block.previousElementSibling;
    await until(() => bar && bar.matches(".rvdiff-mode"), "the switch before the block");
    const cs = el => win.getComputedStyle(el);
    const ins = block.querySelector("ins"), del = block.querySelector("del"), same = block.querySelector(".same");
    const cut = block.querySelectorAll("p")[2];
    eq(mode(bar), "diff", "starts on Diff");
    click(bar.querySelector('[data-v="final"]'));
    eq(mode(bar), "final");
    ok(block.classList.contains("final"), "block marked final");
    eq(cs(del).display, "none", "removed words hidden");
    eq(cs(ins).textDecorationLine, "none", "added words not underlined");
    eq(cs(ins).backgroundColor, "rgba(0, 0, 0, 0)", "added words have no background");
    eq(cs(ins).color, cs(ins.parentElement).color, "added words in the text colour");
    eq(cs(same).color, cs(block).color, "unchanged text no longer dimmed");
    eq(cs(cut).display, "none", "a fully removed sentence leaves no empty line");
    eq(block.querySelectorAll("p")[1].textContent.replace(/\s+/g, " "), "The core ran at 1020 Gb/s.", "text itself untouched");
    click(bar.querySelector('[data-v="diff"]'));
    eq(mode(bar), "diff");
    match(cs(ins).textDecorationLine, /underline/, "underline back");
    match(cs(del).textDecorationLine, /line-through/, "strikethrough back");
    ok(cs(del).display !== "none" && cs(cut).display !== "none", "removed text back");
    ok(cs(same).color !== cs(block).color, "unchanged text dimmed again");
  });
  await t("diff switch: for all flips every block, goes mixed when one differs, and the view survives a reload", async () => {
    let { doc } = await load("/demo/sm-diff-3.html");
    const all = doc.querySelector("main > .rvdiff-all");
    ok(all, "a for-all switch at the top of main");
    const blocks = () => Array.from(doc.querySelectorAll(".rvdiff"));
    eq(blocks().length, 2);
    click(all.querySelector('[data-v="final"]'));
    ok(blocks().every(b => b.classList.contains("final")), "every block final");
    ok(blocks().every(b => mode(b.previousElementSibling) === "final"), "every block switch says Final");
    eq(mode(all), "final");
    click(blocks()[0].previousElementSibling.querySelector('[data-v="diff"]'));
    eq(mode(all), "", "for-all shows neither once blocks differ");
    click(blocks()[0].previousElementSibling.querySelector('[data-v="final"]'));
    eq(mode(all), "final", "for-all follows when they agree again");
    ({ doc } = await load("/demo/sm-diff-3.html"));
    ok(Array.from(doc.querySelectorAll(".rvdiff")).every(b => b.classList.contains("final")), "Final kept after a reload");
    eq(doc.querySelectorAll(".rvdiff-mode:not(.rvdiff-all)").length, 2, "one switch per block, no duplicates");
  });
  await t("diff switch: a labelled group of buttons, reachable by keyboard, with a visible focus ring", async () => {
    const { win, doc } = await load("/demo/sm-diff-4.html");
    const bars = Array.from(doc.querySelectorAll(".rvdiff-mode"));
    ok(bars.length === 3, "two block switches and one for-all");
    for (const b of bars) {
      eq(b.getAttribute("role"), "group");
      ok(b.getAttribute("aria-label"), "group has a label");
      for (const x of b.querySelectorAll("button")) {
        eq(x.tagName, "BUTTON"); eq(x.type, "button"); ok(x.tabIndex === 0, "in the tab order");
        ok(x.hasAttribute("aria-pressed"), "toggle state exposed");
      }
    }
    const btn = bars[1].querySelector('[data-v="final"]');
    btn.focus();
    eq(doc.activeElement, btn, "focusable");
    await until(() => win.getComputedStyle(btn).outlineStyle !== "none", "focus ring");
    ok(parseFloat(win.getComputedStyle(btn).outlineWidth) >= 2, "focus ring at least 2px");
  });
  await t("mark unanswered: confirm with the count, fill only open items, keep earlier answers and notes, saved", async () => {
    const { win, doc, bar } = await load("/demo/sm-mark-1.html");
    const card = id => doc.getElementById("rv-" + id);
    const seg = (id, v) => card(id).querySelector('.seg button[data-v="' + v + '"]');
    const ans = id => { const b = card(id).querySelector(".seg button[aria-pressed=true]"); return b ? b.dataset.v : ""; };
    ok(bar.querySelector(".rvpop.menu .all-yes"), "Mark unanswered Yes in the More menu");
    eq(bar.querySelector(".rvpop.menu .all-yes").textContent, "Mark unanswered Yes");
    eq(bar.querySelector(".rvpop.menu .all-no").textContent, "Mark unanswered No");
    click(seg("r1", "chg")); const ta = card("r1").querySelector("textarea"); ta.value = "keep this note"; ta.dispatchEvent(new win.Event("input"));
    click(seg("r2", "yes"));
    let asked = [];
    win.confirm = m => { asked.push(m); return false; };
    click(bar.querySelector(".all-no"));
    eq(asked.length, 1); match(asked[0], /^Mark the 2 unanswered items No\?/);
    eq(ans("r3"), ""); eq(ans("r4"), "");
    win.confirm = m => { asked.push(m); return true; };
    click(bar.querySelector(".all-no"));
    eq(ans("r1"), "chg"); eq(ta.value, "keep this note"); eq(ans("r2"), "yes"); eq(ans("r3"), "no"); eq(ans("r4"), "no");
    ok(bar.querySelector(".rvpop.menu").hidden, "menu closes");
    await saved();
    const box = await (await fetch(win.siteReview.saveUrl, { cache: "no-store" })).json();
    eq(box.r3.v, "no"); eq(box.r4.v, "no"); eq(box.r1.v, "chg"); eq(box.r1.n, "keep this note"); eq(box.r2.v, "yes");
    match(win.siteReview.results(), /- \[r4\] NO: /);
    let alerted = ""; asked = []; win.alert = m => { alerted = m; };
    click(bar.querySelector(".all-yes"));
    eq(asked.length, 0); eq(alerted, "Every item already has an answer.");
    eq(ans("r3"), "no");
  });
  await t("mark unanswered: hidden, blocked, locked and question items are left alone", async () => {
    const { win, doc, bar } = await load("/demo/sm-mark-2.html");
    const ans = id => { const b = doc.querySelector("#rv-" + id + " .seg button[aria-pressed=true]"); return b ? b.dataset.v : ""; };
    click(doc.querySelector('#rv-s3 .seg button[data-v="skip"]'));
    const s1 = ans("s1");
    const asked = []; win.confirm = m => { asked.push(m); return true; };
    click(bar.querySelector(".all-yes"));
    eq(asked.length, 1); match(asked[0], /^Mark the 1 unanswered item Yes\?/);
    eq(ans("s2"), "yes"); eq(ans("s3"), "skip"); eq(ans("s1"), s1); eq(ans("s4"), "");
    const q = doc.querySelector(".rv.question textarea"); eq(q.value, "");
  });
  await t("mark unanswered: a page of choices only says nothing is unanswered and asks nothing", async () => {
    const { win, doc, bar } = await load("/demo/sm-mark-3.html");
    let asked = 0, alerted = ""; win.confirm = () => { asked++; return true; }; win.alert = m => { alerted = m; };
    click(bar.querySelector(".all-yes"));
    eq(asked, 0); eq(alerted, "Every item already has an answer.");
    eq(doc.querySelectorAll(".rv.choice .seg button[aria-pressed=true]").length, 0);
  });
})().catch(e => { results.harness = "FAIL " + String(e && e.stack || e); })
  .finally(() => { document.getElementById("out").textContent = JSON.stringify(results); });
</script></body></html>
